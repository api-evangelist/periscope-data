description: 'Periscope Data was a cloud business-intelligence and analytics platform (SQL-based
  dashboards, data exploration, and reporting for data teams), backed by Bessemer Venture Partners,
  GV, SuSa Ventures and Threshold Ventures. It was acquired by Sisense in 2019; the product is now
  Sisense for Data Teams and the periscopedata.com domain 301-redirects to sisense.com. No standalone
  Periscope Data developer portal, documentation, or public API surface remains as of this enrichment pass.'
